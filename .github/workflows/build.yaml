name: Build

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes pipe-operators

      - name: Static checks for the nix flake
        run: nix flake check

      - name: Build binary artifact
        run: nix build .#default -o result

      - uses: actions/upload-artifact@v7
        with:
          name: system-x86_64-linux
          path: result/bin/system
          if-no-files-found: error

      - name: Build container image
        run: nix build .#image -o result-image

      - name: Tag container image
        run: |
          IMAGE=$(docker load < result-image | sed -n 's/^Loaded image: //p')
          REPO="ghcr.io/${GITHUB_REPOSITORY,,}"

          docker tag "$IMAGE" "$REPO:${GITHUB_SHA}"

      - name: GHCR login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: GHCR push
        run: |
          REPO="ghcr.io/${GITHUB_REPOSITORY,,}"

          docker push "$REPO:${GITHUB_SHA}"

